# 从规则分前 20 的美股新闻里选 6–8 条，写中文摘要和为什么重要
# 格式说明见 docs/10 第 3 节；输入输出模型在 contracts/capabilities.tsp
id: news.us_rank
version: 3
summary: 从规则分前 20 的美股新闻里选 6–8 条，写中文摘要和为什么重要
owner: newsroom
runtime: python
tier: balanced
autonomy: L2
prompt: prompts/news_us_rank.md
io:
  input: UsRankInput
  output: UsRankOutput
limits:
  maxInputTokens: 30000
  maxOutputTokens: 2500
  timeoutSec: 90
checks:
  - numbers_in_sources
  - source_ids_exist
  - no_advice
  - length_within
fallback: top_by_score        # 按规则分取前 6 条，只放标题和来源
params: {}
evals:
  dataset: evals/news.us_rank/
  thresholds:
    schema_valid: 1.0
    source_ids_exist: 1.0
    numbers_in_sources: 1.0
    must_include: 0.8
    judge_specific: 0.8
