components:
  parameters:
    HubHttp.CursorParams.cursor:
      name: cursor
      in: query
      required: false
      description: 上一页返回的 nextCursor；取第一页时不传
      schema:
        type: string
      explode: false
    HubHttp.CursorParams.limit:
      name: limit
      in: query
      required: false
      description: 每页条数，1–100（docs/09 第 1 节：单页不超过 100 条）；不传时默认 20
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      explode: false
  schemas:
    AiCall:
      type: object
      required:
        - capability
        - version
        - model
        - inputTokens
        - outputTokens
        - costUsd
        - durationMs
        - ok
        - runId
        - at
      properties:
        capability:
          type: string
          description: 能力 ID，如 news.ticker_digest
        version:
          type: integer
          format: int32
          description: 能力清单的 version
        model:
          type: string
          description: 实际调用的模型（供应商/模型），如 openai/gpt-6-luna
        inputTokens:
          type: integer
          format: int32
          description: 输入 token 数
        outputTokens:
          type: integer
          format: int32
          description: 输出 token 数
        costUsd:
          type: number
          format: double
          description: 费用（美元），按 config/llm.yaml 的单价计算
        durationMs:
          type: integer
          format: int32
          description: 耗时（毫秒）
        ok:
          type: boolean
          description: 是否成功
        runId:
          anyOf:
            - type: string
            - type: 'null'
          description: 所属运行（Run.id）；API 里的按需调用（如控制台问论文）没有运行记录，为 null
        at:
          type: string
          format: date-time
          description: 调用时间（按天统计用量要用）
      description: 一次 AI 能力调用的记录（ai_calls 表，docs/09 第 3 节；运行时在 docs/10 第 5 节第 7 步回调写入）
    AiUsageCapability:
      type: object
      required:
        - capability
        - calls
        - failedCalls
        - inputTokens
        - outputTokens
        - costUsd
      properties:
        capability:
          type: string
          description: 能力 ID
        calls:
          type: integer
          format: int32
          description: 调用次数
        failedCalls:
          type: integer
          format: int32
          description: 其中失败的次数
        inputTokens:
          type: integer
          format: int32
          description: 输入 token 合计
        outputTokens:
          type: integer
          format: int32
          description: 输出 token 合计
        costUsd:
          type: number
          format: double
          description: 费用合计（美元）
      description: 某个能力的用量
    AiUsageDay:
      type: object
      required:
        - date
        - calls
        - failedCalls
        - inputTokens
        - outputTokens
        - costUsd
      properties:
        date:
          type: string
          format: date
        calls:
          type: integer
          format: int32
          description: 调用次数
        failedCalls:
          type: integer
          format: int32
          description: 其中失败的次数
        inputTokens:
          type: integer
          format: int32
          description: 输入 token 合计
        outputTokens:
          type: integer
          format: int32
          description: 输出 token 合计
        costUsd:
          type: number
          format: double
          description: 费用合计（美元）
      description: 某一天的用量
    AiUsageStats:
      type: object
      required:
        - calls
        - failedCalls
        - inputTokens
        - outputTokens
        - costUsd
      properties:
        calls:
          type: integer
          format: int32
          description: 调用次数
        failedCalls:
          type: integer
          format: int32
          description: 其中失败的次数
        inputTokens:
          type: integer
          format: int32
          description: 输入 token 合计
        outputTokens:
          type: integer
          format: int32
          description: 输出 token 合计
        costUsd:
          type: number
          format: double
          description: 费用合计（美元）
      description: 一组 AI 调用的合计
    AiUsageSummary:
      type: object
      required:
        - days
        - total
        - byDay
        - byCapability
        - monthCostUsd
        - monthlyBudgetUsd
      properties:
        days:
          type: integer
          format: int32
          description: 统计窗口：最近多少天（含今天）
        total:
          $ref: '#/components/schemas/AiUsageStats'
          description: 窗口内的合计
        byDay:
          type: array
          items:
            $ref: '#/components/schemas/AiUsageDay'
          description: 按 Asia/Singapore（UTC+8）日期统计（日期升序；没有调用的日子不出现）
        byCapability:
          type: array
          items:
            $ref: '#/components/schemas/AiUsageCapability'
          description: 按能力
        monthCostUsd:
          type: number
          format: double
          description: 按 Asia/Singapore（UTC+8）月份统计的本月累计费用（美元），与窗口无关
        monthlyBudgetUsd:
          type: number
          format: double
          description: 月度预算（美元，config/llm.yaml 的 monthlyBudgetUsd）
      description: |-
        GET /v1/ai/usage?days 的用量汇总（ai_calls 表的 SQL 聚合）。
        控制台“运维”页显示用量与费用并对比月度预算，“今日”页显示本月 AI 费用（docs/05 第 6 节）。
    Article:
      type: object
      required:
        - id
        - sourceId
        - kind
        - title
        - url
        - publishedAt
        - summary
        - lang
        - tickers
        - topics
        - paywall
        - clusterId
      properties:
        id:
          type: string
        sourceId:
          type: string
        kind:
          type: string
          enum:
            - news
            - filing
            - press_release
            - macro
        title:
          type: string
        url:
          type: string
        publishedAt:
          type: string
          format: date-time
        summary:
          anyOf:
            - type: string
            - type: 'null'
        lang:
          type: string
        tickers:
          type: array
          items:
            type: string
        topics:
          type: array
          items:
            type: string
        paywall:
          $ref: '#/components/schemas/NewsPaywall'
        clusterId:
          anyOf:
            - type: string
            - type: 'null'
    ArticleTimelineItem:
      type: object
      required:
        - kind
        - at
        - article
      properties:
        kind:
          type: string
          enum:
            - article
        at:
          type: string
          format: date-time
        article:
          $ref: '#/components/schemas/Article'
    AutonomyLevel:
      type: string
      enum:
        - L0
        - L1
        - L2
        - L3
      description: 自治等级（docs/10 第 6 节）
    BriefInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsPromptItem'
    BriefOutput:
      type: object
      required:
        - briefs
      properties:
        briefs:
          type: array
          items:
            $ref: '#/components/schemas/NewsBrief'
        generatedBy:
          $ref: '#/components/schemas/GeneratedBy'
    CalendarEvent:
      type: object
      required:
        - kind
        - date
        - fredReleaseId
        - at
        - title
        - tickers
        - timing
        - importance
      properties:
        kind:
          type: string
          enum:
            - macro
            - earnings
            - fomc
        date:
          type: string
          format: date
        fredReleaseId:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
        title:
          type: string
        tickers:
          type: array
          items:
            type: string
        timing:
          anyOf:
            - type: string
            - type: 'null'
        importance:
          type: string
    CapabilityEvals:
      type: object
      required:
        - dataset
        - schedule
        - thresholds
      properties:
        dataset:
          type: string
          description: 评测集目录，如 evals/news.ticker_digest/
        schedule:
          $ref: '#/components/schemas/EvalSchedule'
          description: 清单没写时为 weekly
        thresholds:
          type: object
          unevaluatedProperties:
            type: number
            format: double
          description: 评测阈值（评分器名 → 最低分 0–1）
      description: 能力的评测设置
    CapabilityInfo:
      type: object
      required:
        - id
        - version
        - summary
        - owner
        - runtime
        - tier
        - model
        - reasoning
        - autonomy
        - prompt
        - io
        - limits
        - checks
        - fallback
        - params
        - evals
        - latestEval
      properties:
        id:
          type: string
          description: 能力 ID，如 news.ticker_digest
        version:
          type: integer
          format: int32
          description: 清单版本：提示词、输入输出或校验变了就 +1
        summary:
          type: string
          description: 一句话说明
        owner:
          type: string
          description: 所属领域，如 newsroom、papers
        runtime:
          $ref: '#/components/schemas/CapabilityRuntime'
        tier:
          $ref: '#/components/schemas/ModelTier'
        model:
          type: string
          description: 档位当前映射到的模型（config/llm.yaml 的 tiers.<tier>.model）
        reasoning:
          $ref: '#/components/schemas/ReasoningEffort'
          description: 档位的推理强度（config/llm.yaml 的 tiers.<tier>.reasoning）
        autonomy:
          $ref: '#/components/schemas/AutonomyLevel'
        prompt:
          type: string
          description: 提示词文件，如 prompts/news_ticker_digest.md
        io:
          $ref: '#/components/schemas/CapabilityIo'
        limits:
          $ref: '#/components/schemas/CapabilityLimits'
        checks:
          type: array
          items:
            type: string
          description: 确定性后置校验，按顺序执行（docs/10 第 5.2 节）
        fallback:
          type: string
          description: 失败时调用方怎么降级
        params:
