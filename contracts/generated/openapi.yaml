            $ref: '#/components/schemas/TickerDigestPoint'
        generatedBy:
          $ref: '#/components/schemas/GeneratedBy'
    TickerDigestPoint:
      type: object
      required:
        - text
        - sourceIds
      properties:
        text:
          type: string
          x-max-chars: 60
        sourceIds:
          type: array
          items:
            type: string
          description: 0–3 个来源，由能力运行时按提示词检查。
    Upload:
      type: object
      required:
        - id
        - filename
        - arxivUrl
        - status
        - error
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        filename:
          anyOf:
            - type: string
            - type: 'null'
        arxivUrl:
          anyOf:
            - type: string
            - type: 'null'
        status:
          $ref: '#/components/schemas/PaperUploadStatus'
        error:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        paperId:
          type: string
          description: 定下后立即写入；重试沿用，避免误加版本后缀。
    UsNewsTopic:
      type: string
      enum:
        - macro_fed
        - earnings
        - ai_semis
        - big_tech
        - crypto
        - policy_geo
        - other
    UsRankInput:
      type: object
      required:
        - candidates
        - minItems
        - maxItems
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/NewsCandidate'
        minItems:
          type: integer
          format: int32
        maxItems:
          type: integer
          format: int32
    UsRankOutput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsRankedItem'
        generatedBy:
          $ref: '#/components/schemas/GeneratedBy'
    WatchItem:
      type: object
      required:
        - symbol
        - name
        - kind
        - group
        - underlying
        - sectorEtf
        - aliases
        - active
      properties:
        symbol:
          type: string
          description: 代码（主键）；加密资产用 BTC、XRP
        name:
          type: string
          description: 中文名或常用名
        kind:
          $ref: '#/components/schemas/WatchItemKind'
        group:
          type: string
          description: 分组（控制台和邮件里按组显示），如 半导体
        underlying:
          anyOf:
            - type: string
            - type: 'null'
          description: 杠杆 ETF / 现货 ETF 并入的标的（新闻、公告都算在标的名下），如 TSMX → TSM；没有时为 null
        sectorEtf:
          anyOf:
            - type: string
            - type: 'null'
          description: 判断“与板块同向”时对照的 ETF；为 null 时用 config/newsroom.yaml 的 defaultSectorEtf
        aliases:
          type: array
          items:
            type: string
          description: 在 RSS 标题里匹配这只股票用的名字（英文按词边界匹配，不区分大小写）
        active:
          type: boolean
          description: 是否启用
      description: 一只自选股（watch_items 表，docs/09 第 3 节）
    WatchItemKind:
      type: string
      enum:
        - stock
        - etf
        - leveraged_etf
        - crypto
      description: |-
        自选股类型（docs/02 第 3 节）：stock 有自己的新闻和 SEC 公告；etf 按代码取新闻再加别名匹配；
        leveraged_etf 并入标的；crypto 用加密新闻和日线（日涨跌幅按 UTC 日计算）
    WeeklyDataHealth:
      type: object
      required:
        - sessions
        - missing
        - directionCoverageDays
        - boundary
      properties:
        sessions:
          type: array
          items:
            type: string
            format: date
          minItems: 5
          maxItems: 5
        missing:
          type: array
          items:
            type: string
        directionCoverageDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: 有方向数据的交易日数量，页面显示覆盖 n/5。
        boundary:
          type: string
      description: WeeklyDataHealth：市场观测台数据。
    WeeklyJudgment:
      type: object
      required:
        - id
        - title
        - result
        - resultNote
      properties:
        id:
          type: string
        title:
          type: string
        result:
          $ref: '#/components/schemas/HypothesisResult'
        resultNote:
          type: string
      description: WeeklyJudgment：市场观测台数据。
    WeeklyLifecycle:
      type: object
      required:
        - persistentDirections
        - oscillatingDirections
        - latestWeakDirections
        - directionCoverageDays
        - windowDays
      properties:
        persistentDirections:
          type: array
          items:
            $ref: '#/components/schemas/MarketAppearance'
        oscillatingDirections:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyOscillatingDirection'
        latestWeakDirections:
          anyOf:
            - type: array
              items:
                type: string
            - type: 'null'
        directionCoverageDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: 有方向数据的交易日数量，页面显示覆盖 n/5。
        windowDays:
          type: number
          enum:
            - 5
      description: WeeklyLifecycle：市场观测台数据。
    WeeklyOscillatingDirection:
      type: object
      required:
        - name
        - signChanges
        - latestRelative
      properties:
        name:
          type: string
        signChanges:
          type: integer
          format: int32
        latestRelative:
          anyOf:
            - type: number
              format: double
            - type: 'null'
          description: 最后交易日缺该方向数据时为空，不回填更早日期。
      description: WeeklyOscillatingDirection：市场观测台数据。
    WeeklyQuestion:
      type: object
      required:
        - question
        - confirm
        - invalidate
      properties:
        question:
          type: string
        confirm:
          type: string
        invalidate:
          type: string
      description: WeeklyQuestion：市场观测台数据。
    WeeklyReport:
      type: object
      required:
        - sessions
        - previousJudgmentVerification
        - threeStructuralChanges
        - lifecycle
        - researchErrors
        - nextWeekQuestions
        - dataAndMethodHealth
        - markdown
      properties:
        sessions:
          type: array
          items:
            type: string
            format: date
          minItems: 5
          maxItems: 5
        previousJudgmentVerification:
          $ref: '#/components/schemas/WeeklyVerification'
        threeStructuralChanges:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyStructuralChange'
        lifecycle:
          $ref: '#/components/schemas/WeeklyLifecycle'
        researchErrors:
          $ref: '#/components/schemas/WeeklyResearchErrors'
        nextWeekQuestions:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/WeeklyQuestion'
              - type: 'null'
        dataAndMethodHealth:
          $ref: '#/components/schemas/WeeklyDataHealth'
        markdown:
          type: string
      allOf:
        - $ref: '#/components/schemas/WeeklySummary'
      description: WeeklyReport：市场观测台数据。
    WeeklyResearchError:
      type: object
      required:
        - id
        - title
        - result
        - reason
      properties:
        id:
          type: string
        title:
          type: string
        result:
          type: string
          enum:
            - NOT_CONFIRMED
        reason:
          type: string
      description: WeeklyResearchError：市场观测台数据。
    WeeklyResearchErrors:
      type: object
      required:
        - items
        - unsettledDue
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyResearchError'
        unsettledDue:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyJudgment'
      description: WeeklyResearchErrors：市场观测台数据。
    WeeklyStructuralChange:
      type: object
      required:
        - name
        - change
        - judgment
        - counter
      properties:
        name:
          type: string
        change:
          type: number
          format: double
        judgment:
          type: string
        counter:
          type: string
      description: WeeklyStructuralChange：市场观测台数据。
    WeeklySummary:
      type: object
      required:
        - date
        - title
        - sentence
        - settledCount
        - researchErrorCount
        - inconclusiveCount
      properties:
        date:
          type: string
          format: date
        title:
          type: string
        sentence:
          type: string
        settledCount:
          type: integer
          format: int32
        researchErrorCount:
          type: integer
          format: int32
        inconclusiveCount:
          type: integer
          format: int32
      description: WeeklySummary：市场观测台数据。
    WeeklyVerification:
      type: object
      required:
        - settledCount
        - confirmedCount
        - notConfirmedCount
        - inconclusiveCount
        - unsettledDueCount
        - items
      properties:
        settledCount:
          type: integer
          format: int32
        confirmedCount:
          type: integer
          format: int32
        notConfirmedCount:
          type: integer
          format: int32
        inconclusiveCount:
          type: integer
          format: int32
        unsettledDueCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyJudgment'
      description: WeeklyVerification：市场观测台数据。
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: 会话 Cookie：Kevin 在控制台用通行密钥登录后由 Better Auth 签发（docs/09 第 2 节）
    ServiceToken:
      type: http
      scheme: Bearer
      description: '服务令牌：计算任务用 HUB_SERVICE_TOKEN，请求头 Authorization: Bearer <令牌>（docs/09 第 2 节）'
