# 由 contracts 生成，勿手改（mise run gen）
openapi: 3.1.0
info:
  title: bowen-hub API
  version: 1.0.0
  description: |-
    Kevin 全部个人产品的唯一 API（docs/08、docs/09）。路径前缀 /v1，只做增量兼容的改动。
    公开 /v1/public/*：无鉴权，只读；私有 /v1/*：会话 Cookie（服务令牌可读全部 GET）；
    内部 /v1/internal/*：服务令牌；另有 /v1/health。错误一律 application/problem+json（RFC 9457）。
tags: []
paths:
  /v1/ai/usage:
    get:
      operationId: PrivatePlatform_getAiUsage
      description: AI 用量汇总（ai_calls 表的聚合）
      parameters:
        - name: days
          in: query
          required: false
          description: 统计最近多少天（含今天），默认 30，按 Asia/Singapore（UTC+8）计
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 30
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsageSummary'
        default:
          description: 错误（application/problem+json，RFC 9457）
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
        - SessionCookie: []
        - ServiceToken: []
      x-task: T02
  /v1/capabilities:
    get:
      operationId: PrivatePlatform_listCapabilities
      description: 能力清单（读 packages/ai 构建时生成的注册表）+ 各能力最近一次评测结果
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
