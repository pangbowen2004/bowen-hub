name: deploy-console
on:
  push:
    branches: [main]
    paths: ["apps/console/**", "packages/ui/**", "packages/contracts/**", "infra/**", ".github/workflows/deploy-console.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-console
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    steps:
      - name: 检出已合并代码
        uses: actions/checkout@v7
        with:
          ref: main
      - name: 准备工具
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
      - name: 安装冻结依赖
        run: mise install && mise run setup
      - name: 正式版构建
        env:
          VITE_USE_MOCKS: "0"
        run: mise exec -- pnpm --filter @bowen-hub/console build
      - name: 正式版发布
        run: mise exec -- pnpm --filter @bowen-hub/infra deploy-pages console production
      - name: 模拟版构建
        env:
          VITE_USE_MOCKS: "1"
        run: mise exec -- pnpm --filter @bowen-hub/console build
      - name: 模拟版预览发布
        run: mise exec -- pnpm --filter @bowen-hub/infra deploy-pages console preview
