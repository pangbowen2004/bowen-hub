name: papers-ingest
on:
  repository_dispatch:
    types: [papers-ingest, papers-revise]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [papers-ingest, papers-revise]
        default: papers-ingest
      upload_id:
        description: 入库的上传记录ID
        type: string
      paper_id:
        description: 重写的论文ID
        type: string
      instructions:
        description: 重写意见
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ vars.HUB_AI_BACKEND == 'subscription' && 'hub-subscription-auth' || format('papers-{0}', github.event.client_payload.uploadId || github.event.client_payload.id || inputs.upload_id || inputs.paper_id || github.run_id) }}
  queue: max
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-24.04
    # 应用45分钟内结束业务并写失败状态；余量用于安装、IO及失败收尾。
    timeout-minutes: 90
    env:
      HUB_AI_BACKEND: ${{ vars.HUB_AI_BACKEND || 'gateway' }}
      HUB_API_URL: ${{ secrets.HUB_API_URL }}
      HUB_SERVICE_TOKEN: ${{ secrets.HUB_SERVICE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: bowen-hub
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPERATION: ${{ github.event.action || inputs.operation }}
      UPLOAD_ID: ${{ github.event.client_payload.uploadId || inputs.upload_id }}
      PAPER_ID: ${{ github.event.client_payload.id || inputs.paper_id }}
      INSTRUCTIONS: ${{ github.event.client_payload.instructions || inputs.instructions }}
    steps:
      - name: 检出已合并代码
        uses: actions/checkout@v7
        with:
          ref: main
      - name: 准备工具
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
      - name: 安装冻结依赖
        run: mise install && mise run setup
      - name: 准备套餐登录
        id: subscription
        if: vars.HUB_AI_BACKEND == 'subscription'
        uses: ./.github/actions/subscription-auth
        with:
          phase: restore
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: 入库或重写并更新派生目录
        timeout-minutes: 60
        run: |
          mise exec -- uv run --project py python - <<'PY'
          import os
          import subprocess
          operation = os.environ['OPERATION']
          if operation == 'papers-ingest':
              identifier = os.environ['UPLOAD_ID']
              command = ['hub', 'papers', 'ingest', identifier]
          elif operation == 'papers-revise':
              identifier = os.environ['PAPER_ID']
              command = ['hub', 'papers', 'revise', identifier]
              if os.environ.get('INSTRUCTIONS'):
                  command += ['--instructions', os.environ['INSTRUCTIONS']]
          else:
              raise SystemExit('未知论文操作')
          if not identifier:
              raise SystemExit('缺少论文操作ID')
          subprocess.run(command, check=True)
          PY
      - name: 保存套餐续期会话（失败时也保存）
        if: always() && steps.subscription.outputs.restored == 'true'
        uses: ./.github/actions/subscription-auth
        with:
          phase: persist
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: 通知既定论文站更新消费者
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST -f event_type=papers-changed
