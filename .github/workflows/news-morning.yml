name: news-morning
on:
  schedule:
    - cron: "10 23 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: 新加坡业务日期（空为今天）
        required: false
        type: string
      force:
        description: 重发已发送版次（不绕过交易日与时间窗）
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ vars.HUB_AI_BACKEND == 'subscription' && 'hub-subscription-auth' || 'news-morning' }}
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      HUB_AI_BACKEND: ${{ vars.HUB_AI_BACKEND || 'gateway' }}
      CI: "true"
      HUB_API_URL: ${{ secrets.HUB_API_URL }}
      HUB_SERVICE_TOKEN: ${{ secrets.HUB_SERVICE_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID || vars.AI_GATEWAY_ID || 'bowen-hub' }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT || vars.EMAIL_SMTP_PORT || '465' }}
      EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
    steps:
      - name: 检出已合并代码
        uses: actions/checkout@v7
        with:
          ref: main
      - name: 准备工具
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
      - name: 安装冻结依赖并生成契约
        run: mise install && mise run setup && mise run gen
      - name: 准备套餐登录
        id: subscription
        if: vars.HUB_AI_BACKEND == 'subscription'
        uses: ./.github/actions/subscription-auth
        with:
          phase: restore
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: 生成、归档并发送早报
        timeout-minutes: 60
        env:
          NEWS_DATE: ${{ inputs.date }}
          NEWS_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          args=(news morning)
          if [[ -n "$NEWS_DATE" ]]; then args+=(--date "$NEWS_DATE"); fi
          if [[ "$NEWS_FORCE" == "true" ]]; then args+=(--force); fi
          mise exec -- uv run --project py --no-sync hub "${args[@]}"

      - name: 周一同一次运行归档并发送周报
        timeout-minutes: 60
        env:
          NEWS_DATE: ${{ inputs.date }}
          NEWS_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          business_day="${NEWS_DATE:-$(TZ=Asia/Singapore date +%F)}"
          if [[ "$(date -d "$business_day" +%u)" != "1" ]]; then exit 0; fi
          args=(news weekly --date "$business_day")
          if [[ "$NEWS_FORCE" == "true" ]]; then args+=(--force); fi
          mise exec -- uv run --project py --no-sync hub "${args[@]}"

      - name: 刷新控制台本月与下月日程（不重发新闻）
        env:
          NEWS_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          args=(news calendar)
          if [[ -n "$NEWS_DATE" ]]; then args+=(--date "$NEWS_DATE"); fi
          mise exec -- uv run --project py --no-sync hub "${args[@]}"

      - name: 保存套餐续期会话（失败时也保存）
        if: always() && steps.subscription.outputs.restored == 'true'
        uses: ./.github/actions/subscription-auth
        with:
          phase: persist
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
