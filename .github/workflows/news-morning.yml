name: news-morning
on:
  schedule:
    - cron: "10 23 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: 新加坡业务日期（空为今天）
        required: false
        type: string
      force:
        description: 重发已发送版次（不绕过交易日与时间窗）
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: news-morning
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: "true"
      HUB_API_URL: ${{ secrets.HUB_API_URL }}
      HUB_SERVICE_TOKEN: ${{ secrets.HUB_SERVICE_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID || vars.AI_GATEWAY_ID || 'bowen-hub' }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
      EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT || vars.EMAIL_SMTP_PORT || '465' }}
      EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
    steps:
      - name: 检出已合并代码
        uses: actions/checkout@v7
        with:
          ref: main
      - name: 准备工具
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
      - name: 安装冻结依赖并生成契约
        run: mise install && mise run setup && mise run gen
      - name: 生成、归档并发送早报
        env:
          NEWS_DATE: ${{ inputs.date }}
          NEWS_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          args=(news morning)
          if [[ -n "$NEWS_DATE" ]]; then args+=(--date "$NEWS_DATE"); fi
          if [[ "$NEWS_FORCE" == "true" ]]; then args+=(--force); fi
          mise exec -- uv run --project py --no-sync hub "${args[@]}"
