name: deploy-api
on:
  push:
    branches: [main]
    paths: ["services/api/**", "packages/contracts/**", "packages/ai/**", "capabilities/**", "prompts/**", "config/llm.yaml", "infra/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-api
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    steps:
      - name: 检出已合并代码
        uses: actions/checkout@v7
        with:
          ref: main
      - name: 准备工具
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.15
      - name: 安装冻结依赖
        run: mise install && mise run setup
      - name: 迁移线上D1
        run: mise run db:migrate:remote
      - name: 发布API
        run: mise exec -- pnpm --filter @bowen-hub/api exec wrangler deploy
