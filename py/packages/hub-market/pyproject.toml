[project]
name = "hub-market"
version = "0.1.0"
description = "领域预接线，业务由后续任务实现"
requires-python = ">=3.14"
dependencies = [
    "hub-core",
    "hub-contracts",
    "hub-providers",
    "typer>=0.24,<1",
    "polars>=1,<2",
]
[project.entry-points."hub.commands"]
eod = "hub_market.eod.commands:register"
compare = "hub_market.compare.commands:register"
migrate = "hub_market.migrate.commands:register"
[tool.uv.sources]
hub-core = { workspace = true }
hub-contracts = { workspace = true }
hub-providers = { workspace = true }
[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
