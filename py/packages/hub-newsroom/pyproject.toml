[project]
name = "hub-newsroom"
version = "0.1.0"
description = "领域预接线，业务由后续任务实现"
requires-python = ">=3.14"
dependencies = ["hub-core", "hub-contracts", "typer>=0.24,<1"]
[project.entry-points."hub.commands"]
editions = "hub_newsroom.editions.commands:register"
migrate = "hub_newsroom.migrate.commands:register"
[tool.uv.sources]
hub-core = { workspace = true }
hub-contracts = { workspace = true }
[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
