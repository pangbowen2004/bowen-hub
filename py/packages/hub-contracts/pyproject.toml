[project]
name = "hub-contracts"
version = "0.1.0"
description = "由 contracts/ 生成的 Pydantic v2 模型（勿手改 generated/）"
requires-python = ">=3.14"
dependencies = [
  "pydantic==2.13.5",
]

[dependency-groups]
# 生成工具与测试依赖（docs/08 第 3 节；T01 甲段说明第 5 条）
dev = [
  "datamodel-code-generator==0.83.0",
  "jsonschema==4.26.0",
  "rfc3339-validator==0.1.4",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
