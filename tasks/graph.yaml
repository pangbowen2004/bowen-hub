    wave: 1
    dependsOn: [T00]
    difficulty: high
    owns: [contracts/**, packages/contracts/**, py/packages/hub-contracts/**, tools/gen/**, fixtures/samples/**]
    read: [docs/08, docs/02 第 5–9 节, docs/03 第 4–7 节, docs/04 第 2–6 节, docs/06 第 1–3 节, docs/09 第 3 节,
           docs/10 第 3、5 节, capabilities/*.yaml, prompts/*.md, config/newsroom.yaml, fixtures/README.md]
    deliver:
      - docs/08 第 5.1 节的全部接口与模型（TypeSpec），每个接口标 x-task；/ask 接口按 text/event-stream 声明
      - contracts/capabilities.tsp：capabilities/*.yaml 里 io 引用的全部输入输出模型（字段和字数上限以对应提示词为准）
      - 生成链：OpenAPI 3.1、JSON Schema、TS（类型、Zod、fetch 客户端、TanStack Query hooks、MSW）、Pydantic v2
      - fixtures/samples/：每个 GET 接口返回的模型至少一份样例，优先由老数据转换（MarketDay 2026-08-27/28、MarketDaySummary、Hypothesis、WeeklyReport、WeeklySummary、MarketEvent、MarketReference、IndexBar、两篇 Paper 与 PaperPrivate、PaperSummary、PapersCatalog、GraphData、SearchIndex、Review、Upload、一期 legacy Edition、一期按新格式手写的早报 Edition、WatchItem、Run、AiCall、EvalResult）
      - MSW 处理器默认返回 samples 里的数据
      - 提示词渲染的共享测试向量（fixtures/samples/prompt-render/），供 T04 两端对照
    accept:
      - "`mise run gen` 连续两次无差异；`mise run contracts:check` 可运行"
      - fixtures/samples 全部通过 JSON Schema 校验（TS 与 Python 各一个测试）
      - 生成的 TS 通过 tsc；生成的 Pydantic 模型能导入并解析全部样例
      - 契约里每个接口都有 x-task，且任务号存在于本文件

