# bowen-hub 任务图
# 规则见 docs/11-Agent协同开发协议.md。状态不写在这里：看分支、PR 和 docs/progress/<任务ID>.md。
#
# 字段：
#   wave         波次（由依赖推出的最早可开工批次；同一波次的任务可以同时做）
#   dependsOn    必须先合并的任务
#   owns         本任务独占的路径（glob）。两个任务的路径有包含关系时，更具体的那条优先
#                （例：T02 拥有 services/api/src/lib/**，但 services/api/src/lib/auth/** 归 T40）
#   scaffolds    本任务一次性建出来的空骨架；合并后归 owns 覆盖它们的任务（docs/11 第 4 节）
#   sharedEdits  明确允许改的别人的文件，以及能改的范围
#   read         开工前要读的文档（只读这些就够了）
#   deliver      交付物
#   accept       验收（命令 + 标准）；结果写进 docs/progress/<任务ID>.md
#   deferred     依赖后面任务、放到 T52 统一验收的项
#   difficulty   high / medium / low（high 建议交给最强的 Agent）
#
# 所有任务都默认要读：AGENTS.md、docs/00、docs/01、docs/11。
# 生成物（mise run gen、TanStack Router 生成的文件）不受所有权限制，但只能由生成命令改动。

tasks:

  # ───────────── 地基与预接线 ─────────────

  - id: T00
    title: 仓库骨架与工具链
    wave: 0
    dependsOn: []
    difficulty: medium
    owns: [mise.toml, package.json, pnpm-workspace.yaml, turbo.json, biome.json, tsconfig.base.json, lighthouserc.json,
           .editorconfig, .gitignore, .dependency-cruiser.cjs, packages/config/**, py/pyproject.toml,
           py/.importlinter, tools/arch/**, tools/tasks/**, .github/workflows/ci.yml]
    read: [docs/01 第 7–8 节, docs/11 第 3–4、8、10 节, docs/12 第 3 节]
    deliver:
      - mise 锁定 Node、pnpm、Python、uv 版本；docs/11 第 10 节的全部 mise 任务（暂时没有内容的先接成空操作）
      - pnpm 工作区 + Turborepo；uv 工作区；Biome、tsc strict、ruff、pyright strict 的共享配置
      - 依赖规则检查（dependency-cruiser、import-linter，规则逐条照 docs/01 第 7 节）
      - tools/tasks：tasks:ready（读本文件和 git 状态，列出可开工任务）、check:ownership（按 PR 标题的任务号检查改动路径，支持 owns、scaffolds、sharedEdits、公共文件和生成物例外）
      - ci.yml（docs/11 第 8 节的步骤，暂时没有内容的步骤自动跳过）；lighthouserc.json（性能与可访问性阈值见 docs/05 第 10 节）
    accept:
      - 干净克隆后 `mise install && mise run setup` 成功
      - "`mise run check`、`mise run test` 通过"
      - "`mise run tasks:ready` 只列出 T01"
      - check:ownership 的单元测试：越界改动被拒绝；公共文件、骨架、生成物、sharedEdits 被允许
      - CI 在一个空 PR 上是绿色

