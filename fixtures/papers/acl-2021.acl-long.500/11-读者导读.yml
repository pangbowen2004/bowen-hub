    "overview": "测试不只看原始数据上的相关性。作者还让可学习指标跨数据集使用，并构造改变故事质量的扰动，观察指标是否能识别问题。这样可以区分“在熟悉分布上与人评分相关”和“换一种故事或错误类型后仍可靠”。这两件事不能用同一个相关系数替代。"
