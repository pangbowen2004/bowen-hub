  "one_sentence": "测试不只看原始数据上的相关性。作者还让可学习指标跨数据集使用，并构造改变故事质量的扰动，观察指标是否能识别问题。这样可以区分“在熟悉分布上与人评分相关”和“换一种故事或错误类型后仍可靠”。这两件事不能用同一个相关系数替代。",
  "reading_goal": "OpenMEVA 不是写故事的模型，而是检查“给故事打分的指标是否可靠”的测试平台。它把故事与众包总体质量评分配对，检验自动指标能否跟随人的判断。这里评的是故事，不是角色对白；MANS 收集的是总体评分，而不是把连贯性、趣味性等拆成独立人评分数。",
  "problem": {
    "question": "OpenMEVA 不是写故事的模型，而是检查“给故事打分的指标是否可靠”的测试平台。它把故事与众包总体质量评分配对，检验自动指标能否跟随人的判断。这里评的是故事，不是角色对白；MANS 收集的是总体评分，而不是把连贯性、趣味性等拆成独立人评分数。",
    "pain": "把长文本生成或评价当成单步任务，会掩盖中间机制及其失效条件。"
