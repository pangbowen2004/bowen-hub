comprehension_check:
  - {question: "为什么年化收益最高仍不能说策略最好？", expected_answer: "还要看波动、Sharpe、回撤、成本和市场暴露；高收益可能由高风险或少数路径驱动。"}
  - {question: "FINSABER 如何减少幸存者偏差？", expected_answer: "使用历史指数成分并纳入退市标的，而不是把今天仍存在的公司回填到过去。"}
  - {question: "论文最低充分结论是什么？", expected_answer: "在论文实现和长期评估范围内，所测 LLM 策略没有稳定风险调整优势；不能外推成所有 LLM 交易永远无效。"}
  - {question: "对科研 Agent 的核心迁移是什么？", expected_answer: "把样本/时间快照、强基线、成本、主指标和 test 隔离写进可审计协议，防止事后选择制造成功。"}
