# 8 个主题篮子 = 若干申万一级行业（2021 版）的组合
# 篮子指标 = 成员行业按样本数加权；成交占比、涨跌停家数直接相加
themes:
  - { name: AI硬件与数字经济, industries: [电子, 通信, 计算机] }
  - { name: 医药健康,         industries: [医药生物, 美容护理] }
  - { name: 高端制造,         industries: [机械设备, 国防军工, 电力设备, 汽车] }
  - { name: 资源周期,         industries: [有色金属, 钢铁, 煤炭, 石油石化, 基础化工] }
  - { name: 大消费,           industries: [食品饮料, 家用电器, 社会服务, 商贸零售, 农林牧渔] }
  - { name: 金融地产,         industries: [银行, 非银金融, 房地产] }
  - { name: 公用防御,         industries: [公用事业, 交通运输, 环保] }
  - { name: 基建链,           industries: [建筑装饰, 建筑材料] }
