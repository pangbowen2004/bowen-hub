# 自选股初始清单（docs/02 第 3 节）
# 来源：Kevin 2026 年 9 月从 moomoo 导出的自选。上线后在控制台维护（写进数据库），这个文件只作初始值。
#
# 字段：
#   symbol      代码（加密资产用 BTC、XRP）
#   name        中文名或常用名
#   kind        stock | etf | leveraged_etf | crypto
#   group       分组（控制台和邮件里按组显示）
#   underlying  杠杆 ETF / 现货 ETF 并入的标的：新闻、公告都算在标的名下
#   sectorEtf   判断“与板块同步”时对照的 ETF（不写就用 newsroom.yaml 的 defaultSectorEtf）
#   aliases     在 RSS 标题里匹配这只股票用的名字（英文按词边界匹配，不区分大小写）
#   verify      true = 待核实：T10 确认代码有效、且在数据源里对应这里写的公司；通过的去掉 verify，无效的从这里删掉，结果写进进度记录
#
# 公司的 SEC 编号（CIK）运行时从 SEC 的 company_tickers.json 自动对照，不在这里填。

items:
