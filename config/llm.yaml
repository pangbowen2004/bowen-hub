# 模型登记表（docs/10 第 4 节）
# 代码和能力清单里只写档位；档位 → 模型只在这里定义一次。
# 换模型：改这里 + 跑 `hub evals compare`，PR 附对比表（docs/10 第 6 节）。

# 所有调用经 Cloudflare AI Gateway 的统一接口（OpenAI 兼容），模型名写成 “供应商/模型”。
# 地址里的两个变量来自环境变量 CLOUDFLARE_ACCOUNT_ID、AI_GATEWAY_ID；供应商 key 用 OPENAI_API_KEY。
gateway:
  baseUrl: "https://gateway.ai.cloudflare.com/v1/{CLOUDFLARE_ACCOUNT_ID}/{AI_GATEWAY_ID}/compat"

# 起步配置偏省钱；哪一档不够好，由评测决定换成更强的模型。
tiers:
  fast:
    model: openai/gpt-6-luna
    reasoning: none            # 推理强度：none | low | medium | high | xhigh | max
  balanced:
    model: openai/gpt-6-luna
    reasoning: medium
  frontier:
    model: openai/gpt-6-sol
    reasoning: high

# 评测对比用的候选（不会被直接使用）
candidates:
  - openai/gpt-6-astra
  - openai/gpt-6-sol
  - openai/gpt-5.4-mini

defaults:
  timeoutSec: 90               # 能力清单的 limits.timeoutSec 优先
  maxRetries: 2                # 失败后再试 2 次，间隔 1s、2s

# 单价（美元 / 每 100 万 token），用来算每次调用的费用。
# GPT-6 三个型号：2026-09-29 按 OpenAI 官方价格页（developers.openai.com/api/docs/pricing）填写；
# gpt-5.4-mini：输入、输出单价沿用老 Daily News 的配置；缓存价取自第三方价格汇总，用到时再核对。价格变了就改这里。
prices:
  openai/gpt-6-luna:   { input: 0.10, cachedInput: 0.01,  output: 0.50 }
  openai/gpt-6-sol:    { input: 2.00, cachedInput: 0.20,  output: 10.00 }
  openai/gpt-6-astra:  { input: 10.00, cachedInput: 1.00, output: 50.00 }
  openai/gpt-5.4-mini: { input: 0.75, cachedInput: 0.075, output: 4.50 }

# 月度预算：超过只提醒（失败通知邮件 + 控制台红字），不自动降级。
monthlyBudgetUsd: 20
